name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finguard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/finguard_test
      JWT_SECRET: test-secret-for-ci
      OPENROUTER_API_KEY: ""
      PLAID_CLIENT_ID: ""
      PLAID_SECRET: ""
      PLAID_ENV: sandbox
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest --cov=app --cov-report=term-missing

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/finguard-api:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/finguard-api:latest \
            ./apps/backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/finguard-api:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/finguard-api:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name finguard-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/finguard-api:${{ github.sha }}
